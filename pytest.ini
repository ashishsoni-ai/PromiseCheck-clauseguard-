[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q keeps checkpoint output readable; -ra surfaces skip/xfail reasons so a
# skipped live test is never mistaken for a passing one.
# -m "not live" makes the default suite offline and deterministic; passing
# -m live on the command line overrides this.
addopts = -ra --strict-markers -m "not live"

markers =
    live: hits a real LLM provider over the network. Deselected by default.
         Run explicitly with: pytest -m live
    slow: takes more than a few seconds (container round-trips, full corpus).
    unit: pure-Python, no network, no LLM. The correctness core.
    integration: crosses module boundaries or talks to a running AUT.
