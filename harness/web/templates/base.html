<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Clauseguard{% endblock %}</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:48rem;margin:0 auto;padding:2rem;background:#0b0b0f;color:#e8e6e0;}
  h1{font-size:1.6rem;margin:0 0 .25rem;}
  a{color:#f0b429;}
  table{border-collapse:collapse;margin:1rem 0;}
  td,th{border:1px solid #333;padding:.5rem .75rem;text-align:center;}
  .over{background:#3a2b05;font-weight:700;}
  .mute{color:#8a867e;}
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
