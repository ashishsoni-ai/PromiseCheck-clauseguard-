# docker-compose - harness + aut-naive + aut-strong (DESIGN.md 1). Filled in STEP 4.
#
# THERE IS DELIBERATELY NO `build:` STANZA FOR THE AGENTS.
# `docker compose build` would produce an image with the AUT_COMMIT_SHA build args unset,
# and that image would report itself as "(unfrozen)" while looking, from the outside, exactly
# like the frozen one. Commitment C3 (DESIGN.md 0) depends on there being one way to build an
# agent, so images come from:
#
#     python scripts/freeze_aut.py aut-naive --tag aut-naive-v1 --build
#
# and compose only ever runs what that produced. An "image not found" error here is the
# correct failure - it means the agent was never frozen. As of this step that is the
# expected state of `aut-strong`: its source is complete and tested, but the tag
# `aut-strong-v1` is not built until the freeze step, so `docker compose up` brings up
# aut-naive and fails on aut-strong until then. Bring them up by name while that is true.
#
# The harness itself is not a service. It runs on the host, talks to the agents over HTTP
# only (DESIGN.md 1.4), and writing it into this file would invite a shared network alias to
# grow into a shared import.

services:
  aut-naive:
    image: ${AUT_NAIVE_IMAGE:-clauseguard/aut-naive:aut-naive-v1}
    container_name: clauseguard-aut-naive
    ports:
      - "8001:8000"
    environment:
      # ollama is the documented default (DESIGN.md 1.4). groq is a development fallback
      # and changes what the frozen tag means, so switching it should be deliberate.
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      # AUT_OLLAMA_HOST, *not* OLLAMA_HOST. Ollama reads OLLAMA_HOST on the host to choose
      # its bind address (often 0.0.0.0:11434 on Windows so a container can reach it), and
      # interpolating that value in here would tell the client to dial 0.0.0.0 - which,
      # inside the container, is the container. Both sides would look right and every
      # request would 502.
      AUT_OLLAMA_HOST: ${AUT_OLLAMA_HOST:-http://host.docker.internal:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    extra_hosts:
      # Ollama runs on the developer's machine, not in the container. Docker Desktop
      # provides this alias already; the mapping is here so a Linux host behaves the same.
      - "host.docker.internal:host-gateway"
    restart: "no"

  aut-strong:
    image: ${AUT_STRONG_IMAGE:-clauseguard/aut-strong:aut-strong-v1}
    container_name: clauseguard-aut-strong
    ports:
      - "8002:8000"
    environment:
      # NO LLM_BACKEND AND NO AUT_OLLAMA_HOST HERE, ON PURPOSE.
      # This agent has no local backend: DESIGN.md 1.4 documents a hosted frontier model
      # for it, so `aut-strong/backends.py` pins no Ollama model and refuses that backend
      # at startup. Passing LLM_BACKEND - which `.env` sets to `ollama` for the service
      # above - would hand this container a request it cannot serve, and it would fail in
      # the worst possible place: /health does not construct a generator, deliberately, so
      # a missing key cannot mark the container unhealthy. The container would go green and
      # 502 every /chat. The agent reads AUT_STRONG_LLM_BACKEND instead, and /health
      # reports which variable it read.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Forwarded so a value set in `.env` reaches the container at all, and defaulted to
      # empty rather than to the pin: the defaults live in the frozen tree (commitment C3),
      # and repeating them here would create a second place for the model id to drift. An
      # empty value reads as "unset" inside the agent, which is why those two resolvers are
      # blank-safe rather than truthiness-only.
      AUT_STRONG_LLM_BACKEND: ${AUT_STRONG_LLM_BACKEND:-}
      AUT_STRONG_GROQ_MODEL: ${AUT_STRONG_GROQ_MODEL:-}
    # No `extra_hosts`. There is nothing on the host for this agent to dial.
    restart: "no"
